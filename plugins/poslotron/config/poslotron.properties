# --------------------------------------------------------------------------
# Pricelist publication (Croatian Trade Act, Art. 12 - cjenik na mreznim
# stranicama). Values below can be overridden per deployment through the
# SystemProperty entity (resource "poslotron", key as below).
# --------------------------------------------------------------------------

# Product store whose catalog (browse root category) defines the products
# published in the cjenik CSV.
pricelist.productStoreId=10010

# Prodajno mjesto elements required in the file name by Art. 12(2): oblik
# (form of the point of sale), adresa (address) and oznaka (identifier) of
# the point of sale. For the webshop these describe the online sales point.
pricelist.pointOfSale.form=web trgovina
pricelist.pointOfSale.address=diykits.eu
pricelist.pointOfSale.identifier=1

# Jedinica mjere written for products that have no quantityUomId set.
pricelist.defaultUnitOfMeasure=kom

# Fallback VAT rate (percentage) used only when the product store has no VAT
# tax authority (vatTaxAuthGeoId/vatTaxAuthPartyId) or no active
# TaxAuthorityRateProduct row. Published prices always include VAT (Art. 12(3)).
pricelist.vat.rate=25

# Directory where generated CSV files are archived. Relative paths are
# resolved against ofbiz.home.
pricelist.output.dir=runtime/poslotron/pricelists

# Days a published pricelist must stay available (Art. 12(5): 30 days from
# the last publication). Older archive entries and files are removed by the
# cleanup job.
pricelist.retention.days=30
